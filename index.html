function home(){const count=answers.filter(x=>x!==null).length;draw(`<section class="hero"><div class="hero-copy"><div class="eyebrow">A LITTLE GUIDE TO YOUR HEART</div><h1>好きになると、<br>わたしは<em>何タイプ？</em></h1><p class="lead">返信を待つ夜も、ふたりで笑う午後も。<br>いつもの自分とは少し違う、恋するあなたを知ろう。</p><button class="primary" onclick="start(false)">${count===36?'診断結果を見る':count?'続きから診断する':'恋の取扱説明書をつくる'} <span>↗</span></button><p class="tiny">36問・約5分 / 無料 / 登録不要</p><div class="stats"><div><strong>16</strong><small>性格タイプ</small></div><div><strong>4</strong><small>愛の届け方</small></div><div><strong>64</strong><small>恋のかたち</small></div></div></div><div class="art"><span class="ring">Every love is a little different.</span>${mascot()}<div class="sticker">あなたらしい恋に、<br>名前をつけよう。</div></div></section><div class="section-head"><div><div class="smallcaps">FOUR WAYS TO LOVE</div><h2>愛の届け方は、ひとつじゃない。</h2></div></div><div class="grid">${Object.entries(styles).map(([k,v],i)=>`<article class="mini"><div class="style-picture">${character(['ENFP','ENTP','ISFJ','INTJ'][i],k)}</div><div class="smallcaps">STYLE ${String(i+1).padStart(2,'0')}</div><h3>${v[0]}</h3><p>${v[1]}</p></article>`).join('')}</div><div class="section-head"><h2>この診断について</h2></div><details><summary>何がわかるの？</summary><p class="note">恋愛場面での4つの傾向と、「言葉／行動」「一緒／それぞれ」の2軸から64タイプをつくります。性別や交際経験にかかわらず、今の自分に近い感覚で答えてください。</p></details><details><summary>結果や相性は、どう決まるの？</summary><p class="note">各軸6問を5段階で採点し、反対向きの質問は点数を反転します。グラフは回答を0〜100に換算した位置で、能力・確率・人口内順位ではありません。中間値は便宜上片側に分類し、結果に明記します。相性は優劣や成功率ではなく、違いの話し合い方を提案します。</p></details><details><summary>回答は保存される？</summary><p class="note">回答は、このブラウザ内にのみ保存します。外部送信はしません。ブラウザの設定によっては保存されません。ホーム下のボタンで削除できます。</p></details><p class="note">心理検査としての妥当性は未検証です。公式MBTI®・医療的診断ではなく、会話や自己理解のきっかけとして楽しんでください。</p><button class="nav" onclick="resetData()">保存した回答を削除</button>`);}
function start(fresh){if(fresh){answers.fill(null);pos=0;save();}if(answers.every(x=>x!==null)){result();return;}pos=answers.findIndex(x=>x===null);quiz();}
function quiz(){const q=qs[pos];draw(`<section class="quiz"><div class="progress-info"><span>YOUR LOVE NOTE</span><span>${pos+1} / 36</span></div><div class="track" role="progressbar" aria-label="回答済み" aria-valuemin="0" aria-valuemax="36" aria-valuenow="${answers.filter(x=>x!==null).length}"><div style="width:${answers.filter(x=>x!==null).length/36*100}%"></div></div><div class="q-num">Question ${String(pos+1).padStart(2,'0')}</div><div class="question-picture">${scene(['talk','date','repair'][q[0]%3])}</div><h1>${q[2]}</h1><p class="note" id="tap-hint">タップで次へ。今の自分に近いものを。</p><div class="answers" aria-describedby="tap-hint">${['とてもそう思う','ややそう思う','どちらともいえない','あまりそう思わない','まったくそう思わない'].map((t,i)=>`<button class="answer" aria-pressed="${answers[pos]===2-i}" onclick="pick(${2-i})"><span>${t}</span><span class="answer-arrow" aria-hidden="true">→</span></button>`).join('')}</div><div class="q-actions"><button class="secondary" onclick="back()">${pos?'← 前の質問':'← ホーム'}</button><span class="tiny">${pos===35?'選ぶと結果が出ます':'1タップで回答'}</span></div><p class="tiny">回答は端末内に自動保存。途中で閉じても再開できます。</p></section>`);}
function pick(v){if(answerTimer!==null)return;answers[pos]=v;save();document.querySelectorAll('.answer').forEach((el,i)=>{el.setAttribute('aria-pressed',String(v===2-i));el.disabled=true;});answerTimer=setTimeout(()=>{answerTimer=null;next();},140);}
function next(){if(answers[pos]===null)return;if(pos<35){pos++;save();quiz();}else result();}
function back(){if(pos){pos--;save();quiz();}else home();}
function score(a){let sums=Array(6).fill(0);qs.forEach((q,i)=>sums[q[0]]+=a[i]*q[1]);let chars=sums.map((v,i)=>axes[i][v>=0?0:1]);return {sums,chars,type:chars.slice(0,4).join(''),style:chars.slice(4).join(''),pct:sums.map(v=>Math.round((v+12)/24*100))};}
function result(){if(answers.some(x=>x===null)){start(false);return;}last=score(answers);renderResult(last,false);}
function renderResult(r,sample){let s=styles[r.style];draw(`<section class="result-head"><div class="smallcaps">${sample?'TYPE PREVIEW / タイプ図鑑':'YOUR PERSONAL LOVE NOTE'}</div><div class="result-art">${character(r.type,r.style)}</div><span class="badge">${r.type} × ${s[0]}</span><h1>${names[r.type]}</h1><p>${s[1]}</p><p class="lead">${s[2]}</p></section><div class="result-columns">${sample?'':`<section class="panel"><h2>あなたの恋のバランス</h2><p class="tiny">％は回答の傾向を換算した値。強さや優劣ではありません。</p>${axes.map((a,i)=>`<div class="axis"><div class="axis-label"><span>${a[2]} ${r.pct[i]}%</span><span>${100-r.pct[i]}% ${a[3]}</span></div><div class="track"><div style="width:${r.pct[i]}%"></div></div>${Math.abs(r.sums[i])<=2?'<small>中間に近い軸：場面によってどちらも表れそう。</small>':''}</div>`).join('')}${r.sums.some(x=>x===0)?'<p class="note">50:50の軸は分類上、左側の文字を使用しています。反対側のタイプも図鑑で見比べてみて。</p>':''}</section>`}<section class="panel ${sample?'wide':''}"><h2>恋を育てる、あなたの強み</h2>${r.type.split('').map(k=>`<h3>${traits[k][0]}</h3><p>${traits[k][1]}</p>`).join('')}</section><section class="panel wide"><div class="smallcaps">A LITTLE LESS MISUNDERSTANDING</div><h2>すれ違う前に、できること。</h2><p>${traits[r.type[2]][2]}</p><p>${traits[r.type[3]][2]}</p><p>${s[3]}</p><h3>こんなふうに伝えてみる</h3><p>「${r.style[1]==='C'?'もう少し一緒に過ごせるとうれしい。今週、無理のないタイミングはある？':'一人で過ごす時間も大切にしたい。でも、あなたとの時間も楽しみにしているよ。次はいつ会おうか？'}」</p></section><section class="panel wide compare"><div class="smallcaps">TWO NOTES, ONE CONVERSATION</div><h2>あの人との、恋の合わせ方。</h2><p>相手のタイプを選んで、共通点と違いを見てみよう。</p><div class="selects"><select id="partner" aria-label="相手の性格タイプ">${Object.keys(names).map(k=>`<option>${k}</option>`).join('')}</select><select id="partner-style" aria-label="相手の愛の届け方">${Object.entries(styles).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><button class="primary" onclick="compare('${r.type}','${r.style}')">ふたりを比べる ↗</button></div><div id="comparison" class="compare-result" aria-live="polite"></div><p class="tiny">タイプだけで恋愛の成功や相性は判断できません。話し合うヒントとして使ってね。</p></section></div><div class="actions">${sample?'<button class="primary" onclick="start(false)">自分を診断する ↗</button>':'<button class="primary" onclick="copyResult()">結果をコピー ↗</button><button class="secondary" onclick="downloadResult()">結果カードを保存</button><button class="secondary" onclick="editAnswers()">回答を見直す</button>'}<button class="secondary" onclick="catalog()">タイプ図鑑</button><button class="secondary" onclick="home()">ホーム</button></div><p class="note" style="text-align:center">${sample?'図鑑はタイプの紹介です。あなたの診断結果ではありません。':'この結果は今の回答をもとにした独自分類です。相手や状況によって変わることがあります。'}</p>`);}
function compare(t,s){let p=document.getElementById('partner').value,ps=document.getElementById('partner-style').value;let parts=[t[0]===p[0]?'人との過ごし方が近い二人。心地よいデートの賑やかさを共有しやすそう。':'賑やかさと静けさの好みが違うかも。出かける時間と、休む時間の両方を予定に。',t[1]===p[1]?'話題の見方が近い二人。同じ視点で楽しめる一方、別の見方も聞いてみて。':'具体的な話と未来の話を行き来して。「いつ・何を」と「どうなりたい」をセットに。',t[2]===p[2]?'悩みへの向き合い方が近い傾向。それでも、その日の相手の希望は聞いてみよう。':'共感してほしい日と、解決したい日がずれるかも。相談の最初に希望を伝えて。',t[3]===p[3]?'予定の立て方が似ている二人。決める役割が片方に偏らないように相談を。':'計画と自由のバランスを相談しよう。集合時間だけ決めて、行き先は自由にするのも手。',s[0]===ps[0]?'愛情を届ける方法が近い二人。受け取った気遣いに気づいたら、お礼を伝えて。':'言葉と行動、愛情の表し方が違う二人。「何をしてもらうとうれしい？」を交換して。',s[1]===ps[1]?'心地よい距離感が近い傾向。生活が変わったときには、改めてペースを確認しよう。':'会う頻度や連絡量を、愛情の大きさと同じにしないこと。無理のない頻度を一緒に決めよう。'];document.getElementById('comparison').innerHTML=`<h3>${t} × ${p}</h3>`+parts.map((x,i)=>`<p><b>0${i+1}</b>　${x}</p>`).join('');}

function personalAdvice(r){const e=advice[r.type[0]],f=advice[r.type[2]],j=advice[r.type[3]];return `<section class="panel wide"><div class="scene-picture">${scene('date')}</div><div class="smallcaps">YOUR LOVE PLAYBOOK</div><h2>あなたの恋、こんなふうに育てよう。</h2><div class="advice-grid">${[[e,'距離の縮め方'],[f,'気持ちの伝え方'],[j,'付き合ってから']].map(([a,label])=>`<article class="advice-item"><span class="pill">${label}</span><h3>${a.title}</h3><p><b>起こりがちなこと</b><br>${a.pit}</p><p><b>試してみること</b><br>${a.action}</p></article>`).join('')}<article class="advice-item"><span class="pill">おすすめデート</span><h3>頑張りすぎず、楽しめる時間を。</h3><p>${e.date}</p><p>${j.date}</p></article></div><h3>今日できる、小さな一歩</h3><p class="speech">${r.style[0]==='A'?'「この前の、あの気遣いがうれしかった」と具体的な感謝を一つ伝えてみる。':'いつもしている気遣いに、「大切に思っているから」を一言添えてみる。'}</p><p class="note">嫌なことを断ることや、会いたい頻度の違いを伝えることも、関係を大切にする行動です。</p></section>`;}
function pairFit(t,s,p,ps){const a=t+s,b=p+ps,w=[1,2,3,3,4,4];return w.reduce((v,n,i)=>v+(a[i]===b[i]?n:0),0);}
function pairReason(t,s,p,ps,good){let a=t+s,b=p+ps;const labels=['人と過ごすペース','会話の視点','相談への向き合い方','予定の立て方','愛情の表し方','心地よい距離感'];return labels.filter((_,i)=>good?a[i]===b[i]:a[i]!==b[i]).slice(-3).join('・')+(good?'が近い組み合わせ。':'の違いを話し合いたい組み合わせ。');}
function matches(r){let all=Object.keys(names).flatMap(t=>Object.keys(styles).map(s=>({t,s,fit:pairFit(r.type,r.style,t,s)})));let good=[...all].sort((a,b)=>b.fit-a.fit||a.t.localeCompare(b.t)||a.s.localeCompare(b.s)).slice(0,3),bad=[...all].sort((a,b)=>a.fit-b.fit||a.t.localeCompare(b.t)||a.s.localeCompare(b.s)).slice(0,3);return `<section class="panel wide"><div class="smallcaps">YOUR COMPATIBILITY GUIDE</div><h2>相性が合いやすい・すれ違いやすいタイプ</h2><p>この診断では、愛情の伝え方と距離感、相談と予定の好みが近いほど「合わせやすい」と考えます。</p><div class="match-grid">${[[good,true,'自然体で過ごしやすい例'],[bad,false,'すり合わせが大切な例']].map(([arr,ok,title])=>`<div class="match-block ${ok?'':'caution'}"><h3>${title}</h3>${arr.map(x=>`<div class="match-row">${character(x.t,x.s)}<div><b>${x.t} × ${styles[x.s][0]}</b><p>${names[x.t]}</p><p>${pairReason(r.type,r.style,x.t,x.s,ok)}</p><button class="text-button" onclick="quickPair('${r.type}','${r.style}','${x.t}','${x.s}')">起きやすいトラブルを見る →</button></div></div>`).join('')}</div>`).join('')}</div><details><summary>相性の選び方を見る</summary><p class="note">独自の編集ルールです。6軸の一致に、交流1・視点2・相談3・予定3・愛情表現4・距離感4の重みを置きます。重みは研究から推定した値ではありません。同点はタイプコード順に並べ、上位・下位の各3例を表示します。成功率や実際の相性を測るものではなく、似ていても違っていても関係は育てられます。</p></details></section>`;}

function renderPair(filter){const {t,s,p,ps}=pairState,a=t+s,b=p+ps,common=[...a].filter((x,i)=>x===b[i]).length;let data=pairScenarios(t,s,p,ps),diff=data.filter((_,i)=>a[i]!==b[i]),same=data.filter((_,i)=>a[i]===b[i]);let shown=filter==='すべて'?[...diff,...same]:data.filter(x=>filter==='連絡・愛情'?['連絡','愛情'].includes(x.tag):filter==='デート・予定'?['デート','予定'].includes(x.tag):['相談','将来'].includes(x.tag));document.getElementById('comparison').innerHTML=`<div class="pair-preview">${character(t,s)}<span>×</span>${character(p,ps)}</div><div class="pair-summary"><h3>${common>=4?'似たペースを味方にする二人':common>=2?'共通点と違いを楽しむ二人':'違いを言葉でつなぐ二人'}</h3><p>${t}・${styles[s][0]} × ${p}・${styles[ps][0]}</p><p>6つの好みのうち${common}軸が同じ。${diff.length?'違いがある場面から、話し合いのヒントを並べました。':'似たタイプ同士でも起こる、思い込みのすれ違いを見てみよう。'}</p></div><div class="context-pills" aria-label="場面を絞り込む">${['すべて','連絡・愛情','デート・予定','相談・将来'].map(k=>`<button aria-pressed="${filter===k}" onclick="renderPair('${k}')">${k}</button>`).join('')}</div>${shown.map((x,i)=>`<article class="risk"><span class="pill">${x.tag}</span><h3>${x.title}</h3><div class="label">起きやすい場面</div><p>${x.trigger}</p><details ${i===0?'open':''}><summary>二人の気持ちと、仲直りのヒント</summary><p class="speech"><b>あなた側の感覚</b><br>${x.you}</p><p class="speech other"><b>相手側の感覚</b><br>${x.them}</p><p><b>二人で決めておくこと</b><br>${x.rule}</p><p><b>責めずに、伝え直すなら</b></p><p class="speech">「${x.line}」</p></details></article>`).join('')}<div class="intro-banner">${scene('repair')}<p><b>仲直りの入り口</b><br>出来事 → 自分の気持ち → 具体的なお願い、の順に。「いつも」「絶対」を避けて、今回の一つを話してみよう。</p></div>`;}
